name: Trigger Auto Merge Automation

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  trigger-auto-merge:
    name: Trigger central auto-merge
    runs-on: ubuntu-latest

    steps:
      - name: Trigger automation repo
        continue-on-error: true
        env:
          GH_TOKEN: $ {{ secrets.AXIONVERA_AUTOMATION_TOKEN }}
        run: |
          jq -n --arg event "axionvera-pr-opened" --arg repo "$ {{ github.repository }}" --arg pr "$ {{ github.event.pull_request.number }}" '{event_type:$event, client_payload:{"repo":$repo, pr_number:$pr}}' |
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/Axionvera/pocketpay-issue-automation/dispatches \
              --input -